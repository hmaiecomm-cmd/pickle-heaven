<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匹克天堂智慧場館 - 快速連接二維碼</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .qr-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
        }

        #qrcode {
            display: inline-block;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .instruction {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 5px;
        }

        .instruction-title {
            color: #1976d2;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .instruction-text {
            color: #555;
            font-size: 13px;
            line-height: 1.6;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 120px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
            min-width: 120px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }

        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-top: 3px solid #667eea;
        }

        .info-card-title {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .info-card-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .url-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            color: #666;
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }

        .badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏢 🎮 📱</div>

        <h1>
            匹克天堂
            <span style="color: #667eea;">智慧場館</span>
            <span class="badge">快速連接</span>
        </h1>
        <p class="subtitle">掃描二維碼以手機連接系統</p>

        <!-- QR Code 區域 -->
        <div class="qr-section">
            <div id="qrcode"></div>
        </div>

        <!-- 連接 URL -->
        <input type="text" class="url-input" id="urlInput" readonly
               placeholder="系統 URL">

        <!-- 指引說明 -->
        <div class="instruction">
            <div class="instruction-title">📱 如何連接？</div>
            <div class="instruction-text">
                1️⃣ 打開手機攝影機應用<br>
                2️⃣ 掃描上方二維碼<br>
                3️⃣ 點擊出現的連結<br>
                4️⃣ 輸入帳號密碼登入
            </div>
        </div>

        <!-- 系統信息 -->
        <div class="info-grid">
            <div class="info-card">
                <div class="info-card-title">🎥 攝影機</div>
                <div class="info-card-value">6 路監控</div>
            </div>
            <div class="info-card">
                <div class="info-card-title">⚡ 電力</div>
                <div class="info-card-value">18 路控制</div>
            </div>
            <div class="info-card">
                <div class="info-card-title">🚪 門禁</div>
                <div class="info-card-value">4 路進出</div>
            </div>
            <div class="info-card">
                <div class="info-card-title">🌡️ 溫控</div>
                <div class="info-card-value">多區域</div>
            </div>
        </div>

        <!-- 操作按鈕 -->
        <div class="controls">
            <button class="btn-primary" onclick="generateQR()">🔄 重新生成</button>
            <button class="btn-secondary" onclick="downloadQR()">⬇️ 下載圖片</button>
        </div>

        <!-- 其他選項 -->
        <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
            <p style="font-size: 12px; color: #999; margin-bottom: 12px;">🔗 快捷連接</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn-secondary" onclick="openDashboard()" style="font-size: 13px;">
                    📊 管理儀表板
                </button>
                <button class="btn-secondary" onclick="openMonitoring()" style="font-size: 13px;">
                    📹 監控中心
                </button>
                <button class="btn-secondary" onclick="openControlPanel()" style="font-size: 13px;">
                    ⚙️ 控制面板
                </button>
                <button class="btn-secondary" onclick="openSettings()" style="font-size: 13px;">
                    ⚙️ 設置
                </button>
            </div>
        </div>

        <div class="footer">
            <p>匹克天堂智慧場館平台 v1.0 |
            <span id="timestamp"></span></p>
            <p style="margin-top: 8px;">🌐
            <span id="deviceInfo"></span></p>
        </div>
    </div>

    <script>
        // 配置
        const CONFIG = {
            baseUrl: window.location.origin,
            appName: '匹克天堂智慧場館',
            version: '1.0',
            controllers: {
                camera: '攝影機監控',
                power: '電力控制',
                door: '門禁管理',
                hvac: '溫控系統'
            }
        };

        // 初始化
        function init() {
            updateTimestamp();
            updateDeviceInfo();
            generateQR();
        }

        // 生成 QR Code
        function generateQR() {
            // 清除舊的 QR Code
            document.getElementById('qrcode').innerHTML = '';

            // 生成連接 URL
            const connectionUrl = `${CONFIG.baseUrl}?app=${encodeURIComponent(CONFIG.appName)}&v=${CONFIG.version}&t=${Date.now()}`;
            document.getElementById('urlInput').value = connectionUrl;

            // 生成新的 QR Code
            new QRCode(document.getElementById('qrcode'), {
                text: connectionUrl,
                width: 250,
                height: 250,
                colorDark: '#000',
                colorLight: '#fff',
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // 下載 QR Code 圖片
        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = `pickle-heaven-qr-${new Date().getTime()}.png`;
                link.click();
            }
        }

        // 打開管理儀表板
        function openDashboard() {
            const url = `${CONFIG.baseUrl}/dashboard`;
            window.open(url, '_blank');
        }

        // 打開監控中心
        function openMonitoring() {
            const url = `${CONFIG.baseUrl}/monitoring`;
            window.open(url, '_blank');
        }

        // 打開控制面板
        function openControlPanel() {
            const url = `${CONFIG.baseUrl}/control`;
            window.open(url, '_blank');
        }

        // 打開設置
        function openSettings() {
            const url = `${CONFIG.baseUrl}/settings`;
            window.open(url, '_blank');
        }

        // 更新時間戳
        function updateTimestamp() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            };
            document.getElementById('timestamp').textContent =
                now.toLocaleDateString('zh-TW', options);
        }

        // 更新設備信息
        function updateDeviceInfo() {
            const ua = navigator.userAgent;
            const isMobile = /mobile|tablet|android|iphone/i.test(ua.toLowerCase());
            const deviceType = isMobile ? '📱 行動設備' : '💻 桌面設備';
            document.getElementById('deviceInfo').textContent = deviceType;
        }

        // 複製連接 URL
        function copyUrl() {
            const urlInput = document.getElementById('urlInput');
            urlInput.select();
            document.execCommand('copy');
            alert('已複製到剪貼板！');
        }

        // 頁面加載完成後初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
