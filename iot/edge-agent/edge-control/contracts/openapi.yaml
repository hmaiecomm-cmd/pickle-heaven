components:
  schemas:
    AddressPreview:
      properties:
        table_type:
          type: string
          enum:
          - coil
          - discrete_input
          - input_register
          - holding_register
          title: Table Type
        reference_address:
          type: string
          title: Reference Address
        base:
          type: integer
          title: Base
          default: 1
      additionalProperties: false
      type: object
      required:
      - table_type
      - reference_address
      title: AddressPreview
    ApplyBody:
      properties:
        expected_revision:
          type: integer
          minimum: 1.0
          title: Expected Revision
          description: active revision the draft was based on
        comment:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Comment
      additionalProperties: false
      type: object
      required:
      - expected_revision
      title: ApplyBody
    BatchBody:
      properties:
        command_id:
          type: string
          maxLength: 80
          minLength: 8
          pattern: ^[A-Za-z0-9._:\-]+$
          title: Command Id
        expires_at:
          type: string
          format: date-time
          title: Expires At
        site_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Site Id
        edge_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Edge Id
        circuit_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: string
            const: all
          title: Circuit Ids
        state:
          type: string
          enum:
          - 'on'
          - 'off'
          title: State
      additionalProperties: false
      type: object
      required:
      - command_id
      - expires_at
      - circuit_ids
      - state
      title: BatchBody
    BookingEvent:
      properties:
        booking_id:
          type: string
          title: Booking Id
        court:
          type: string
          enum:
          - court_a
          - court_b
          title: Court
        start:
          type: string
          format: date-time
          title: Start
        end:
          type: string
          format: date-time
          title: End
        status:
          type: string
          enum:
          - active
          - cancelled
          title: Status
          default: active
        revision:
          type: integer
          minimum: 1.0
          title: Revision
      additionalProperties: false
      type: object
      required:
      - booking_id
      - court
      - start
      - end
      - revision
      title: BookingEvent
    BookingEvents:
      properties:
        events:
          items:
            $ref: '#/components/schemas/BookingEvent'
          type: array
          maxItems: 500
          title: Events
        full_snapshot:
          type: boolean
          title: Full Snapshot
          default: false
      additionalProperties: false
      type: object
      required:
      - events
      title: BookingEvents
    DraftPut:
      properties:
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
          description: draft_revision last seen by the editor (0 = no draft yet)
        deployment:
          additionalProperties: true
          type: object
          title: Deployment
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - deployment
      title: DraftPut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HvacSettingsBody:
      properties:
        command_id:
          type: string
          maxLength: 80
          minLength: 8
          pattern: ^[A-Za-z0-9._:\-]+$
          title: Command Id
        expires_at:
          type: string
          format: date-time
