# MQTT ACL 配置 — 訪問控制清單

# ═════════════════════════════════════════════════════════════
# 規則語法
# ═════════════════════════════════════════════════════════════
#
# user <username>
# topic [read|write] <topic_filter>
#
# pattern:
#   $CLIENTID — 替換為連接的客戶端 ID
#   + — 單層萬用字元
#   # — 多層萬用字元（只能用在末尾）

# ═════════════════════════════════════════════════════════════
# 雲端網關（可發送控制命令）
# ═════════════════════════════════════════════════════════════

user cloud_gateway
# 寫入控制命令到所有迴路
topic write pickle-heaven-001/control/+/ctl

# 讀取所有設備狀態
topic read pickle-heaven-001/control/+/data

# 讀取心跳與狀態
topic read pickle-heaven-001/gateway/#

# ═════════════════════════════════════════════════════════════
# 本地 Agent（訂閱並執行控制命令）
# ═════════════════════════════════════════════════════════════

user local_agent
# 讀取所有控制命令
topic read pickle-heaven-001/control/+/ctl

# 寫入設備狀態
topic write pickle-heaven-001/control/+/data

# 寫入心跳與狀態
topic write pickle-heaven-001/gateway/#

# ═════════════════════════════════════════════════════════════
# 監控用戶（只讀）
# ═════════════════════════════════════════════════════════════

user admin_monitor
# 讀取所有主題（監控）
topic read pickle-heaven-001/#

# ═════════════════════════════════════════════════════════════
# 橋接用戶（與雲端 Broker 的雙向同步）
# ═════════════════════════════════════════════════════════════

user bridge_user
# 橋接用戶需要讀寫權限
topic write pickle-heaven-001/control/+/ctl
topic read pickle-heaven-001/control/+/data
topic write pickle-heaven-001/gateway/#

# ═════════════════════════════════════════════════════════════
# 預設規則
# ═════════════════════════════════════════════════════════════

# 拒絕所有未明確允許的訪問
# （allow_anonymous = false 已在 mosquitto.conf 中禁用匿名）
