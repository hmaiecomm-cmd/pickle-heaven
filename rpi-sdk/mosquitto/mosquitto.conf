# Mosquitto Broker 配置 — Pickle Heaven 現場部署

# ═════════════════════════════════════════════════════════════
# 基本設定
# ═════════════════════════════════════════════════════════════

# 偵聽埠（無 TLS）
listener 1883

# 偵聽埠（TLS）
listener 8883
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
cafile /etc/mosquitto/certs/ca.crt
tls_version tlsv1.2

# 允許內部橋接（與雲端 Broker 連接）
listener 1884

# ═════════════════════════════════════════════════════════════
# 認證與授權
# ═════════════════════════════════════════════════════════════

# 禁止匿名連接
allow_anonymous false

# 密碼檔案（由 setup-users.sh 生成）
password_file /etc/mosquitto/passwd

# ACL 檔案（訪問控制）
acl_file /etc/mosquitto/acl.conf

# ═════════════════════════════════════════════════════════════
# 日誌設定
# ═════════════════════════════════════════════════════════════

log_dest syslog
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout

log_type all
log_timestamp true

# ═════════════════════════════════════════════════════════════
# 消息轉儲與保留
# ═════════════════════════════════════════════════════════════

# 啟用 MQTT v3.1.1 與 v5.0
protocol_version 4

# 消息最大大小（字節）
max_queued_messages 1000
max_inflight_messages 20

# 會話保留時間
persistent_client_expiration 60d

# ═════════════════════════════════════════════════════════════
# 連接限制
# ═════════════════════════════════════════════════════════════

# 最大連接數
max_connections -1

# 每個客戶端最多訂閱主題數
max_subscriptions_per_client 50

# ═════════════════════════════════════════════════════════════
# 保留消息（用於心跳狀態）
# ═════════════════════════════════════════════════════════════

# 啟用保留消息
retain_available true

# 保留消息過期時間（秒）
# 0 = 永遠保留
max_queued_messages 1000

# ═════════════════════════════════════════════════════════════
# 橋接配置（用於與雲端 Broker 連接）
# ═════════════════════════════════════════════════════════════

# 注：實際的橋接配置應從 /etc/mosquitto/conf.d/bridge.conf 載入
# 此處為預留，允許在生成環境動態配置

include_dir /etc/mosquitto/conf.d

# ═════════════════════════════════════════════════════════════
# 系統設定
# ═════════════════════════════════════════════════════════════

# PID 檔案
pid_file /var/run/mosquitto.pid

# 系統信息主題
sys_interval 60

# 系統時鐘偏差告警
log_type action

# ═════════════════════════════════════════════════════════════
# 安全設定
# ═════════════════════════════════════════════════════════════

# 啟用 websocket（可選，用於 web 客戶端）
# listener 9001
# protocol websockets

# 關閉不安全連接（生產環境）
# 注：開發時可保留 1883 無認證連接，生產應移除
